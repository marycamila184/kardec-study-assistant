[project]
name = "kardec-study-assistant"
version = "0.1.0"
description = "Backend and LLM study assistant based on Allan Kardec's works"
authors = [
    { name = "Mary Camila" }
]
requires-python = ">=3.12"

dependencies = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv",
    "google-cloud-firestore>=2.29.0",
    "pywebpush>=2.4.0",
]

[dependency-groups]
# sentence-transformers pulls torch, and torch pulls CUDA: ~4.7 GB that exists
# only to run BAAI/bge-m3 in-process. Since 2026-07-27 production calls the same
# model over HTTP (EMBEDDING_PROVIDER), so the runtime image must not carry any
# of it — the container is pulled on every cold start. Parsing and ingestion
# still run it locally, offline, which is what this group is for.
ingest = [
    "sentence-transformers>=2.7.0",
]

dev = [
    {include-group = "ingest"},
    "black",
    "isort",
    "pytest",
    "httpx",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

