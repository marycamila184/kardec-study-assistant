# Runs on every PR and on every push to main/development.
#
# Needs no secrets: `together_api_key` is optional in config.py and no test
# calls the network for real — the 401 that shows up in the log is a
# degradation test exercising its failure path. The index (`data/embeddings/`)
# is gitignored and is not needed either: the tests fake the store. This was
# checked by deleting .env and data/embeddings before running the suite, which
# is exactly what the clean checkout here sees.
name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      # --no-group ingest leaves torch and CUDA out: ~4.7 GB that exist only to
      # run bge-m3 in-process, which the suite does not need. Same reason the
      # production image does not carry them.
      - name: Install dependencies
        run: uv sync --group dev --no-group ingest

      - name: Formatting
        run: |
          uv run black --check src/ tests/
          uv run isort --check-only src/ tests/

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The guards this repo wrote and that nothing ran automatically until
      # they were wired in here. The current_mode one exists because two call
      # sites were fixed by hand and three others kept the bug: without it, a
      # /chat call missing `current_mode` silently re-enables self-nudging.
      # check_discovery_assets.mjs and check_pwa_manifest.mjs read the built
      # artifact in frontend/dist, so they must run after Build.
      - name: Frontend guards
        working-directory: .
        run: |
          node scripts/check_chat_current_mode.mjs
          node scripts/check_cited_text.mjs
          node scripts/check_followup_reply.mjs
          node scripts/check_discovery_assets.mjs
          node scripts/check_api_base.mjs
          node scripts/check_pwa_manifest.mjs

  # O único job que executa o JavaScript e fala com a API. Existe porque a
  # migração para Astro publicou duas falhas que passaram por todas as outras
  # verificações: o build aceita qualquer string, as guardas leem HTML, o
  # pytest é do backend, e na máquina de quem desenvolve o endereço existe.
  # Este job cobre só uma das duas — o CORS preso na porta do Vite — porque só
  # um navegador de verdade falando com uma API de verdade revela isso. A
  # outra falha, localhost:8000 dentro do bundle, este job não pode pegar por
  # construção: `npm run smoke` constrói de propósito com PUBLIC_API_URL
  # apontando para a API local, então "localhost" no dist dele é o esperado.
  # Essa é a responsabilidade de check_api_base.mjs, no job `frontend`, contra
  # um build de produção.
  #
  # Precisa de Python e de Node no mesmo runner: o Playwright sobe a API e o
  # `astro preview` juntos. Não precisa de chave de LLM nem do índice — as
  # asserções param na costura navegador↔API e /paths lê data/paths/, que é
  # commitado.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      # Reinstala tudo que o job `frontend` já instalou, de propósito: a
      # isolação (runner limpo, `dist/` próprio) é o ponto, porque o build
      # deste job aponta para localhost e não pode nunca dividir um `dist/`
      # com o job das guardas. Sem este comentário, alguém vai "otimizar" isto
      # para um `needs:` encadeado e reintroduzir esse risco.
      - name: Install backend dependencies
        run: uv sync --group dev --no-group ingest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # O script constrói com PUBLIC_API_URL apontando para a API local antes
      # de rodar — por isso este job NÃO roda as guardas: o dist que ele produz
      # aponta para localhost de propósito, e é o job `frontend` que confere o
      # dist de produção.
      - name: Smoke test
        working-directory: frontend
        run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
